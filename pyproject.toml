[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hbn-seqmap"
version = "0.1.0"
description = "Nested sequential EEG feature-panel selection and cross-release visualization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]
[project.optional-dependencies]
docs = ["reportlab>=4,<5"]
bdf = ["mne>=1.6,<2"]
[project.scripts]
hbn-r4 = "hbn_r4.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
